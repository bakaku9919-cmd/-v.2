<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анкета участника</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="desing/css/style bw.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Навигация -->
  <nav>
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <a href="index.html" class="text-lg font-bold">Исследование</a>
      <div class="flex gap-6">
        <a href="index.html">Главная</a>
        <a href="#" class="open-privacy-modal">Конфиденциальность</a>
      </div>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-6 py-16">
    <div class="question-card">
      <h1 class="text-2xl font-semibold text-center mb-6">Анкета участника</h1>
      
      <p class="text-sm text-gray-500 text-center mb-8">
        Пожалуйста, ответьте на несколько вопросов о себе. Это займёт не более 2 минут.
      </p>

      <div class="space-y-6">

        <div>
          <label class="block text-sm font-medium mb-2">Ваш пол:</label>
          <div class="flex gap-6">
            <label><input type="radio" name="gender" value="male" class="mr-1"> Мужской</label>
            <label><input type="radio" name="gender" value="female" class="mr-1"> Женский</label>
            <label><input type="radio" name="gender" value="other" class="mr-1"> Другой</label>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Ваш возраст (лет):</label>
          <input type="number" id="age" placeholder="Например: 34" class="w-full p-3 border border-gray-300 rounded-lg">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Ваше образование:</label>
          <select id="education" class="w-full p-3 border border-gray-300 rounded-lg">
            <option value="">Выберите...</option>
            <option value="bachelor">Бакалавриат</option>
            <option value="specialist">Специалитет</option>
            <option value="master">Магистратура</option>
            <option value="phd">Ученая степень</option>
            <option value="incomplete">Неоконченное высшее</option>
            <option value="secondary">Средне-специальное</option>
            <option value="other">Другое</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-2">Ваша специальность / Кем работаете?</label>
          <input type="text" id="profession" placeholder="Например: преподаватель, психолог, инженер..." class="w-full p-3 border border-gray-300 rounded-lg">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Место работы / учебы:</label>
          <input type="text" id="workplace" placeholder="Например: школа, университет, частная практика..." class="w-full p-3 border border-gray-300 rounded-lg">
        </div>
      </div>

      <button onclick="startFirstTest()" class="btn-primary w-full mt-8">
        Продолжить →
      </button>
    </div>
  </div>

<script>
  function startFirstTest() {
    const data = {
      gender: document.querySelector('input[name="gender"]:checked')?.value || "",
      age: document.getElementById('age').value,
      education: document.getElementById('education').value,
      profession: document.getElementById('profession').value,
      workplace: document.getElementById('workplace').value,
      totalExperience: document.getElementById('total-experience').value,
      specialExperience: document.getElementById('special-experience').value,
      timestamp: new Date().toISOString()
    };

    // ID участника
    const participantId = 'P_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
    localStorage.setItem('participantId', participantId);
    localStorage.setItem('participantData', JSON.stringify(data));
    localStorage.setItem('currentTestIndex', '0');
    localStorage.setItem('testResults', JSON.stringify([]));
    localStorage.setItem('consentGiven', 'true');

    // Google Sheets
    sendToGoogleSheets(data, "Анкета");

    window.location.href = "tests/life-prod.html";
  }

  async function sendToGoogleSheets(data, sheetName) {
    const scriptURL = "https://script.google.com/macros/s/AKfycbxaH8oWEE0mkKv89nnS-IMU4BkfVX9G0MGzcnnc_pUJImb3WO1e0XtdRwKJbUUc4KmuXw/exec";
    const formData = new FormData();
    formData.append("test_name", sheetName);
    for (const [key, value] of Object.entries(data)) {
      if (value !== undefined && value !== "") {
        formData.append(key, value);
      }
    }
    try {
      await fetch(scriptURL, { method: "POST", body: formData, mode: "no-cors" });
      console.log("✅ Анкета отправлена");
    } catch (e) {
      console.error("❌ Ошибка:", e);
    }
  }
</script>

</body>
</html>
