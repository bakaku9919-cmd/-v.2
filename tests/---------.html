<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16 типов личности — Юнг.Тест</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="../desing/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="../index.html" class="flex items-center gap-3">
        <i class="fa-solid fa-brain text-indigo-600 text-3xl"></i>
        <h1 class="text-2xl font-bold text-indigo-700">Юнг.Тест</h1>
      </a>
      <a href="../index.html" class="text-gray-500 hover:text-gray-700">← На главную</a>
    </div>
  </nav>

  <div class="max-w-3xl mx-auto px-6 py-10">
    <div class="mb-10">
      <div class="flex justify-between text-sm text-gray-500 mb-2">
        <span>Вопрос <span id="current-question">1</span> из <span id="total-questions">48</span></span>
        <span id="progress-text">0%</span>
      </div>
      <div class="test-progress bg-gray-200 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="test-progress-bar h-full bg-indigo-600 w-0 transition-all"></div>
      </div>
    </div>

    <div id="question-card" class="question-card">
      <h2 id="question-text" class="text-2xl font-medium mb-10"></h2>
      <div id="options" class="space-y-4"></div>
    </div>

    <div class="test-nav mt-12 flex justify-between">
      <button id="btn-prev" class="btn-test btn-test-prev">← Назад</button>
      <button id="btn-next" class="btn-test btn-test-next">Далее →</button>
    </div>
  </div>

  <!-- Результат -->
  <div id="result-screen" class="hidden max-w-3xl mx-auto px-6 py-10">
    <div class="result-card text-center">
      <h2 class="text-3xl font-light mb-4">Ваш тип личности</h2>
      <div id="personality-type" class="result-type text-7xl mb-2"></div>
      <div id="personality-name" class="text-2xl mb-8"></div>
      <div id="description" class="text-left"></div>
      
      <div class="mt-10 flex gap-4 justify-center">
        <button onclick="restartTest()" class="btn-test btn-test-prev">Пройти заново</button>
        <button onclick="saveAndShowThanks()" class="btn-test btn-test-finish">Сохранить результат</button>
      </div>
    </div>
  </div>

  <script src="../desing/js/quiz.js"></script>
</body>
</html>
