<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опросник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../desing/css/style-bw.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <nav>
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <a href="../index.html" class="text-lg font-bold">Исследование</a>
      <div class="flex gap-6">
        <a href="../index.html">Главная</a>
        <a href="#" class="open-privacy-modal">Конфиденциальность</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="question-card">
      <h2 class="text-xl font-bold text-center mb-2">Опросник</h2>
      <p class="text-sm text-gray-500 text-center mb-8">
        Оцените, насколько каждое утверждение соответствует Вам.
      </p>

      <div class="overflow-x-auto">
        <table class="question-table">
          <thead>
            <tr>
              <th class="text-left py-2 pr-4">Вопрос</th>
              <th class="text-center py-2 px-1 w-10">-3</th>
              <th class="text-center py-2 px-1 w-10">-2</th>
              <th class="text-center py-2 px-1 w-10">-1</th>
              <th class="text-center py-2 px-1 w-10">0</th>
              <th class="text-center py-2 px-1 w-10">1</th>
              <th class="text-center py-2 px-1 w-10">2</th>
              <th class="text-center py-2 px-1 w-10">3</th>
            </tr>
          </thead>
          <tbody id="questionsContainer">
          </tbody>
        </table>
      </div>

      <div class="mt-10">
        <button onclick="submitAll()" class="btn-primary w-full">
          Отправить результаты
        </button>
      </div>
    </div>
  </div>

  <script>

    let gender = "";
    let age = "";
    let education = "";
    let participantId = localStorage.getItem('participantId') || "";

    try {
      const participantData = JSON.parse(localStorage.getItem('participantData') || '{}');
      gender = participantData.gender || "";
      age = participantData.age || "";
      education = participantData.education || "";
      console.log("✅ Данные анкеты загружены:", { gender, age, education, participantId });
    } catch (e) {
      console.warn("⚠️ Нет данных анкеты, используются пустые значения");
    }

  
    const questions = [

      "Я не люблю помогать другим: пусть сами о себе позаботятся",          // 3
      "Если я вижу физические страдания другого, я стараюсь чем-то помочь", // 4
      "Прежде чем взяться за работу, я спрашиваю, сколько заплатят",        // 5
      "Помогать другим - большая радость",                                 // 6
      "Тратить время на помощь другим не имеет смысла",                    // 7
      "Я придерживаюсь принципа: помоги другому, и добро вернется",        // 8
      "Помогать другим — дело бесполезное",                                // 9
      "Мне бы хотелось иметь условия, чтобы приносить пользу людям",       // 10
      "Я считаю, что всякая работа должна оплачиваться",                   // 11
      "В мире есть дела, которые стоит выполнять бескорыстно",             // 12
      "Если мне предлагают сделать что-то на общественных началах, я задумываюсь, что мне это даст", // 15
      "Я хотел бы участвовать в волонтерской программе",                   // 16
      "Если мне предлагают что-то на общественных началах, я отказываюсь", // 17
      "Я часто берусь за работу и не спрашиваю, какую выгоду это принесет",// 18
      "Увидев несчастный случай, я пройду мимо",                           // 19
      "Люди достаточно добры, и если я окажусь в беде, кто-то поможет",   // 20
      "Я не верю, что в случае беды кто-то придет на помощь",             // 21
      "Я не могу спокойно смотреть на страдания других",                   // 22
    ];


    const directIndices = [1, 3, 5, 7, 9, 13, 15, 17, 19];
    const invertedIndices = [0, 2, 4, 6, 8, 12, 14, 16, 18];

    const testSequence = [
      { id: "life-prod", title: "Опросник 1", file: "life-prod.html" },
      { id: "spiritual-orientation", title: "Опросник 2", file: "spirit-orient.html" },
      { id: "spiritual-personality", title: "Опросник 3", file: "spirit-person.html" },
      { id: "altruism", title: "Опросник 4", file: "altruism.html" },
      { id: "sjo", title: "Опросник 5", file: "sjo.html" },
      { id: "wisdom", title: "Опросник 6", file: "wisdom.html" },
      { id: "reflex", title: "Опросник 7", file: "reflex.html" },
      { id: "self-inter", title: "Опросник 8", file: "self-inter.html" },
      { id: "pfoo", title: "Опросник 9", file: "pfoo.html" },
      { id: "motiv", title: "Опросник 10", file: "motiv.html" }
    ];

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      let html = '';
      questions.forEach((text, index) => {
        const num = index + 1;
        html += `
          <tr>
            <td class="q-text text-sm py-2 pr-4">${num}. ${text}</td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="-3" id="q${num}_-3">
              <label for="q${num}_-3">-3</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="-2" id="q${num}_-2">
              <label for="q${num}_-2">-2</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="-1" id="q${num}_-1">
              <label for="q${num}_-1">-1</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="0" id="q${num}_0">
              <label for="q${num}_0">0</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="1" id="q${num}_1">
              <label for="q${num}_1">1</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="2" id="q${num}_2">
              <label for="q${num}_2">2</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="3" id="q${num}_3">
              <label for="q${num}_3">3</label>
            </td>
          </tr>
        `;
      });
      container.innerHTML = html;
    }

    // GOOGLE SHEETS
    async function saveToGoogleSheets(data) {
      const scriptURL = "https://script.google.com/macros/s/AKfycbw0jaAr2DBRKEQm3eyOcRfgqdw_DeSX0QD_VOfjCW_J6Gwrl-PJ-7xnIK8El-N-1WWb/exec";
      const formData = new FormData();

      formData.append("participant_id", participantId);
      formData.append("test_name", "Альтруизм");
      formData.append("gender", gender);
      formData.append("age", age);
      formData.append("education", education);
      formData.append("total_score", data.totalScore);
      formData.append("percentage", data.percentage);
      formData.append("level", data.level);
      formData.append("direct_score", data.directScore);
      formData.append("inverted_score", data.invertedScore);

      try {
        await fetch(scriptURL, { method: "POST", body: formData, mode: "no-cors" });
        console.log("✅ Результаты 'Альтруизм' отправлены");
        return true;
      } catch (e) {
        console.error("❌ Ошибка отправки:", e);
        return false;
      }
    }

    async function submitAll() {
      const answers = {};
      const radios = document.querySelectorAll('input[type="radio"]:checked');

      radios.forEach(el => {
        const name = el.name;
        const num = parseInt(name.substring(1));
        answers[num] = parseInt(el.value);
      });

      if (Object.keys(answers).length < questions.length) {
        alert(`Пожалуйста, ответьте на все вопросы. Заполнено ${Object.keys(answers).length} из ${questions.length}.`);
        return;
      }

      // Расчёт
      let directScore = 0;
      let invertedScore = 0;

      directIndices.forEach(idx => {
        const val = answers[idx + 1] || 0;
        directScore += val + 3;
      });

      invertedIndices.forEach(idx => {
        const val = answers[idx + 1] || 0;
        invertedScore += 3 - val; 
      });

      const totalScore = directScore + invertedScore;
      const maxScore = 18 * 6; 
      const percentage = Math.round((totalScore / maxScore) * 100);

      let level, description;
      if (percentage >= 83) {
        level = "Очень высокий уровень альтруизма";
        description = "Вы склонны к бескорыстной помощи, состраданию и самопожертвованию.";
      } else if (percentage >= 65) {
        level = "Высокий уровень альтруизма";
        description = "Вы часто помогаете другим, руководствуясь этическими нормами и чувством долга.";
      } else if (percentage >= 46) {
        level = "Средний уровень альтруизма";
        description = "Вы помогаете, но в разумных пределах, с учётом своих возможностей и интересов.";
      } else if (percentage >= 28) {
        level = "Низкий уровень альтруизма";
        description = "Вы склонны к рациональному подходу. Помощь оправдана только при наличии выгоды.";
      } else {
        level = "Очень низкий уровень альтруизма";
        description = "Вы ориентированы на личные интересы. Помощь другим кажется вам бессмысленной.";
      }

      const result = {
        totalScore,
        maxScore,
        percentage,
        level,
        description,
        directScore,
        invertedScore
      };

      console.log("📊 Результаты:", result);

      const testResults = JSON.parse(localStorage.getItem('testResults') || '[]');
      const currentIndex = parseInt(localStorage.getItem('currentTestIndex') || '0');

      testResults[currentIndex] = {
        id: testSequence[currentIndex]?.id || "altruism",
        name: testSequence[currentIndex]?.title || "Опросник",
        totalScore,
        percentage,
        level,
        directScore,
        invertedScore,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('testResults', JSON.stringify(testResults));

      const success = await saveToGoogleSheets(result);

      if (success) {
        const nextIndex = currentIndex + 1;
        if (nextIndex < testSequence.length) {
          localStorage.setItem('currentTestIndex', nextIndex);
          window.location.href = testSequence[nextIndex].file;
        } else {
          window.location.href = "../complete.html";
        }
      } else {
        alert("Произошла ошибка при отправке данных. Попробуйте ещё раз.");
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
    });
  </script>

</body>
</html>
