<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опросник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../desing/css/style-bw.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <nav>
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <a href="../index.html" class="text-lg font-bold">Исследование</a>
      <div class="flex gap-6">
        <a href="../index.html">Главная</a>
        <a href="#" class="open-privacy-modal">Конфиденциальность</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="question-card">
      <h2 class="text-xl font-bold text-center mb-2">Опросник</h2>
      <p class="text-sm text-gray-500 text-center mb-8">
        Оцените, насколько каждое утверждение соответствует Вам, по шкале от 1 до 4.
      </p>

      <div class="overflow-x-auto">
        <table class="question-table">
          <thead>
            <tr>
              <th class="text-left py-2 pr-4">Вопрос</th>
              <th class="text-center py-2 px-1 w-10">1</th>
              <th class="text-center py-2 px-1 w-10">2</th>
              <th class="text-center py-2 px-1 w-10">3</th>
              <th class="text-center py-2 px-1 w-10">4</th>
            </tr>
          </thead>
          <tbody id="questionsContainer">
          </tbody>
        </table>
      </div>

      <div class="mt-10">
        <button onclick="submitAll()" class="btn-primary w-full">
          Отправить результаты
        </button>
      </div>
    </div>
  </div>

  <script>
    let gender = "";
    let age = "";
    let education = "";
    let participantId = localStorage.getItem('participantId') || "";

    try {
      const participantData = JSON.parse(localStorage.getItem('participantData') || '{}');
      gender = participantData.gender || "";
      age = participantData.age || "";
      education = participantData.education || "";
      console.log("✅ Данные анкеты загружены:", { gender, age, education, participantId });
    } catch (e) {
      console.warn("⚠️ Нет данных анкеты, используются пустые значения");
    }

    const questions = [
      "Я обычно задумываюсь о причинах того, что со мной происходит",
      "Иногда внимание к собственным переживаниям отвлекает меня от дел",
      "Я люблю мечтать о том, чего в моей жизни нет",
      "Анализируя собственные действия, я узнаю о себе что-то новое",
      "Я склонен долго переживать по поводу происходящего",
      "Я могу замечтаться и забыть обо всем",
      "Изучение других людей помогает мне лучше понимать самого себя",
      "Когда у меня что-то идет не так, мне трудно от этого отвлечься",
      "Я люблю пофантазировать",
      "Часто полезно остановиться, чтобы лучше понять ситуацию в целом",
      "Мне бывает трудно перейти от размышлений к действию",
      "Мне интересно представлять себя в разных ситуациях",
      "В случае конфликта полезно попытаться увидеть ситуацию глазами оппонента",
      "Приступая к какому-либо делу, я долго беспокоюсь о том, что получится в результате",
      "Я люблю представлять в своем воображении случайные встречи",
      "Самопознание помогает понимать других людей",
      "Когда я замечаю, что тревожусь о чем-то, я начинаю переживать еще сильнее",
      "Занимаясь чем-то, я нередко мысленно переношусь совсем в другое место",
      "Чтобы понять ситуацию, нужно уметь соотносить свои чувства с тем, что их вызывает",
      "Нередко я не могу отделаться от мыслей о моих текущих проблемах",
      "Мне нравится мысленно путешествовать по местам, где я еще не был",
      "Больше всего я узнаю о себе, когда анализирую то, что сделал или делаю",
      "Порой я настолько сильно переживаю свои ошибки, что не в состоянии ничего сделать, чтобы их исправить",
      "Я часто фантазирую о том, как моя жизнь могла бы сложиться иначе",
      "Расхождение взглядов других людей с моими служит для меня источником ценной информации",
      "Я постоянно думаю о своих неудачах",
      "Мне легко увлечься посторонними мыслями",
      "Я обращаю внимание на то, как я реагирую на людей и события",
      "Когда в моей жизни происходит что-то необычное, я вижу в этом повод задуматься",
      "Во многих ситуациях бывает полезно сначала разобраться в собственных желаниях и чувствах"
    ];

    const scales = {
      "Системная рефлексия": [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 29, 30],
      "Интроспекция": [2, 5, 8, 11, 14, 17, 20, 23, 26],
      "Квазирефлексия": [3, 6, 9, 12, 15, 18, 21, 24, 27]
    };

    const testSequence = [
      { id: "life-prod", title: "Опросник 1", file: "life-prod.html" },
      { id: "spiritual-orientation", title: "Опросник 2", file: "spirit-orient.html" },
      { id: "spiritual-personality", title: "Опросник 3", file: "spirit-person.html" },
      { id: "altruism", title: "Опросник 4", file: "altruism.html" },
      { id: "sjo", title: "Опросник 5", file: "sjo.html" },
      { id: "wisdom", title: "Опросник 6", file: "wisdom.html" },
      { id: "reflex", title: "Опросник 7", file: "reflex.html" },
      { id: "self-inter", title: "Опросник 8", file: "self-inter.html" },
      { id: "pfoo", title: "Опросник 9", file: "pfoo.html" },
      { id: "motiv", title: "Опросник 10", file: "motiv.html" }
    ];

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      let html = '';
      questions.forEach((text, index) => {
        const num = index + 1;
        html += `
          <tr>
            <td class="q-text text-sm py-2 pr-4">${num}. ${text}</td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="1" id="q${num}_1">
              <label for="q${num}_1">1</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="2" id="q${num}_2">
              <label for="q${num}_2">2</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="3" id="q${num}_3">
              <label for="q${num}_3">3</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="4" id="q${num}_4">
              <label for="q${num}_4">4</label>
            </td>
          </tr>
        `;
      });
      container.innerHTML = html;
    }

    async function saveToGoogleSheets(data) {
      const scriptURL = "https://script.google.com/macros/s/AKfycbxaH8oWEE0mkKv89nnS-IMU4BkfVX9G0MGzcnnc_pUJImb3WO1e0XtdRwKJbUUc4KmuXw/exec";
      const formData = new FormData();
      formData.append("participant_id", participantId);
      formData.append("test_name", "ДТР (Дифференциальный тест рефлексивности)");
      formData.append("gender", gender);
      formData.append("age", age);
      formData.append("education", education);
      formData.append("total_score", data.totalScore);
      formData.append("percentage", data.percentage);
      formData.append("level", data.level);
      formData.append("systemic", data.systemic);
      formData.append("introspection", data.introspection);
      formData.append("quasi", data.quasi);

      try {
        await fetch(scriptURL, { method: "POST", body: formData, mode: "no-cors" });
        console.log("✅ Результаты 'ДТР' отправлены");
        return true;
      } catch (e) {
        console.error("❌ Ошибка отправки:", e);
        return false;
      }
    }

    async function submitAll() {
      const answers = {};
      const radios = document.querySelectorAll('input[type="radio"]:checked');
      radios.forEach(el => {
        const name = el.name;
        const num = parseInt(name.substring(1));
        answers[num] = parseInt(el.value);
      });

      if (Object.keys(answers).length < questions.length) {
        alert(`Пожалуйста, ответьте на все вопросы. Заполнено ${Object.keys(answers).length} из ${questions.length}.`);
        return;
      }

      let systemic = 0, introspection = 0, quasi = 0;
      for (const [name, indices] of Object.entries(scales)) {
        let score = 0;
        indices.forEach(num => { score += answers[num] || 0; });
        if (name === "Системная рефлексия") systemic = score;
        else if (name === "Интроспекция") introspection = score;
        else if (name === "Квазирефлексия") quasi = score;
      }

      const totalScore = systemic + introspection + quasi;
      const maxScore = 30 * 4;
      const percentage = Math.round((totalScore / maxScore) * 100);

      let level, description;
      if (percentage >= 80) {
        level = "Высокая рефлексивность";
        description = "Вы склонны к глубокому анализу себя и ситуации.";
      } else if (percentage >= 60) {
        level = "Средняя рефлексивность";
        description = "Вы способны к самоанализу, но иногда он переходит в чрезмерное переживание.";
      } else {
        level = "Низкая рефлексивность";
        description = "Склонность к рефлексии выражена слабо.";
      }

      const result = { totalScore, percentage, level, description, systemic, introspection, quasi };

      const testResults = JSON.parse(localStorage.getItem('testResults') || '[]');
      const currentIndex = parseInt(localStorage.getItem('currentTestIndex') || '0');

      testResults[currentIndex] = {
        id: testSequence[currentIndex]?.id || "reflex",
        name: testSequence[currentIndex]?.title || "Опросник",
        totalScore,
        percentage,
        level,
        systemic,
        introspection,
        quasi,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('testResults', JSON.stringify(testResults));

      const success = await saveToGoogleSheets(result);
      if (success) {
        const nextIndex = currentIndex + 1;
        if (nextIndex < testSequence.length) {
          localStorage.setItem('currentTestIndex', nextIndex);
          window.location.href = testSequence[nextIndex].file;
        } else {
          window.location.href = "../complete.html";
        }
      } else {
        alert("Произошла ошибка при отправке данных. Попробуйте ещё раз.");
      }
    }

    document.addEventListener('DOMContentLoaded', renderQuestions);
  </script>

</body>
</html>
