<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опросник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../desing/css/style-bw.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <nav>
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <a href="../index.html" class="text-lg font-bold">Исследование</a>
      <div class="flex gap-6">
        <a href="../index.html">Главная</a>
        <a href="#" class="open-privacy-modal">Конфиденциальность</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="question-card">
      <h2 class="text-xl font-bold text-center mb-2">Опросник</h2>
      <p class="text-sm text-gray-500 text-center mb-8">
        Оцените, насколько каждое утверждение соответствует Вам, по шкале от 1 до 5.
      </p>

      <div class="overflow-x-auto">
        <table class="question-table">
          <thead>
            <tr>
              <th class="text-left py-2 pr-4">Вопрос</th>
              <th class="text-center py-2 px-1 w-10">1</th>
              <th class="text-center py-2 px-1 w-10">2</th>
              <th class="text-center py-2 px-1 w-10">3</th>
              <th class="text-center py-2 px-1 w-10">4</th>
              <th class="text-center py-2 px-1 w-10">5</th>
            </tr>
          </thead>
          <tbody id="questionsContainer">
          </tbody>
        </table>
      </div>

      <div class="mt-10">
        <button onclick="submitAll()" class="btn-primary w-full">
          Отправить результаты
        </button>
      </div>
    </div>
  </div>

  <script>

    let gender = "";
    let age = "";
    let education = "";
    let participantId = localStorage.getItem('participantId') || "";

    try {
      const participantData = JSON.parse(localStorage.getItem('participantData') || '{}');
      gender = participantData.gender || "";
      age = participantData.age || "";
      education = participantData.education || "";
      console.log("✅ Данные анкеты загружены:", { gender, age, education, participantId });
    } catch (e) {
      console.warn("⚠️ Нет данных анкеты, используются пустые значения");
    }

    const questions = [
      "Доброта – одно из моих главных качеств",
      "Необходимость сделать что-то сложное и важное тяготит меня",
      "Я не считаю, что в споре может быть только одна правильная точка зрения",
      "Мне достаточно легко дается усвоение новых знаний",
      "Я часто действую необдуманно",
      "Я хорошо разбираюсь в жизни",
      "Обычно мне несложно перейти от замыслов к делу",
      "Мне бывает сложно понять, что я чувствую в данный момент",
      "Мне легко найти выход из сложной ситуации",
      "Я считаю себя терпеливым человеком",
      "Мне нравится заботиться о других людях",
      "Я умею признавать свои ошибки",
      "Прежде чем принять решение, я задумываюсь о его возможных последствиях",
      "В критических ситуациях мне очень сложно сдерживать эмоции",
      "Я доброжелательно отношусь к людям",
      "Приняв решение, я не отступаю от своей цели",
      "Обычно мне не сложно понять других людей и их поступки",
      "Обычно я не жалею о том, что уже сделано",
      "Меня легко раздражают люди, которые спорят со мной",
      "Я не боюсь препятствий в достижении цели",
      "Я принимаю жизнь такой, какая она есть",
      "Мне не сложно принять мнение другого человека, даже если оно отлично от моего собственного",
      "Я часто ссорюсь с людьми по различным причинам",
      "Обычно я стараюсь понять причину того или иного события, поступка",
      "Я во многом недоволен своей жизнью",
      "Когда я озадачен проблемой, одно из первых, что я делаю, это анализ всей имеющейся информации",
      "Если я вижу, что человеку нужна помощь, я пытаюсь ему помочь",
      "Я могу найти общий язык с большинством людей",
      "Обычно я стараюсь утешить и успокоить человека, когда тот нуждается в этом",
      "Обычно мне не сложно сконцентрироваться на главном, не отвлекаясь по пустякам",
      "Я всегда пытаюсь рассмотреть проблему со всех сторон",
      "Обычно я не могу долго таить зла на человека и прощаю его, даже если он меня сильно обидел"
    ];

    // Шкалы
    const scales = {
      "Когнитивная сфера (К)": [3, 12, 13, 17, 22, 24, 26, 31],
      "Поведенческие проявления (П)": [4, 6, 7, 9, 16, 18, 20, 28, 30],
      "Гуманистическая направленность (Г)": [1, 10, 11, 15, 21, 27, 29, 32],
      "Спонтанность эмоциональной сферы (С)": [2, 5, 8, 14, 19, 23, 25]
    };

    // Обратная шкала
    const reverseItems = [2, 5, 8, 14, 19, 23, 25];

    const testSequence = [
      { id: "life-prod", title: "Опросник 1", file: "life-prod.html" },
      { id: "spiritual-orientation", title: "Опросник 2", file: "spirit-orient.html" },
      { id: "spiritual-personality", title: "Опросник 3", file: "spirit-person.html" },
      { id: "altruism", title: "Опросник 4", file: "altruism.html" },
      { id: "sjo", title: "Опросник 5", file: "sjo.html" },
      { id: "wisdom", title: "Опросник 6", file: "wisdom.html" },
      { id: "reflex", title: "Опросник 7", file: "reflex.html" },
      { id: "self-inter", title: "Опросник 8", file: "self-inter.html" },
      { id: "pfoo", title: "Опросник 9", file: "pfoo.html" },
      { id: "motiv", title: "Опросник 10", file: "motiv.html" }
    ];

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      let html = '';
      questions.forEach((text, index) => {
        const num = index + 1;
        html += `
          <tr>
            <td class="q-text text-sm py-2 pr-4">${num}. ${text}</td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="1" id="q${num}_1">
              <label for="q${num}_1">1</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="2" id="q${num}_2">
              <label for="q${num}_2">2</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="3" id="q${num}_3">
              <label for="q${num}_3">3</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="4" id="q${num}_4">
              <label for="q${num}_4">4</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="5" id="q${num}_5">
              <label for="q${num}_5">5</label>
            </td>
          </tr>
        `;
      });
      container.innerHTML = html;
    }

    //GOOGLE SHEETS
    async function saveToGoogleSheets(data) {
      const scriptURL = "https://script.google.com/macros/s/AKfycbxhpWs3iBBuulhpDawZFWJ7VMpd632e6AwgH2QwRFhZPaSolaPUa-F9yGHvGkk3-ouj/exec";
      const formData = new FormData();

      formData.append("participant_id", participantId);
      formData.append("test_name", "Методика диагностики мудрости");
      formData.append("timestamp", new Date().toISOString());
      formData.append("gender", gender);
      formData.append("age", age);
      formData.append("education", education);
      formData.append("total_score", data.totalScore);
      formData.append("percentage", data.percentage);
      formData.append("level", data.level);
      formData.append("K", data.K);
      formData.append("P", data.P);
      formData.append("G", data.G);
      formData.append("S", data.S);

      try {
        await fetch(scriptURL, { method: "POST", body: formData, mode: "no-cors" });
        console.log("✅ Результаты 'Мудрость' отправлены");
        return true;
      } catch (e) {
        console.error("❌ Ошибка отправки:", e);
        return false;
      }
    }

    async function submitAll() {
      const answers = {};
      const radios = document.querySelectorAll('input[type="radio"]:checked');

      radios.forEach(el => {
        const name = el.name;
        const num = parseInt(name.substring(1));
        answers[num] = parseInt(el.value);
      });

      if (Object.keys(answers).length < questions.length) {
        alert(`Пожалуйста, ответьте на все вопросы. Заполнено ${Object.keys(answers).length} из ${questions.length}.`);
        return;
      }

      // Инверсия для С
      const normalized = {};
      for (let i = 1; i <= 32; i++) {
        const val = answers[i] || 0;
        normalized[i] = reverseItems.includes(i) ? (6 - val) : val;
      }

      // Расчет
      let K = 0, P = 0, G = 0, S = 0;

      for (const [name, indices] of Object.entries(scales)) {
        let score = 0;
        indices.forEach(num => {
          score += normalized[num] || 0;
        });
        if (name === "Когнитивная сфера (К)") K = score;
        else if (name === "Поведенческие проявления (П)") P = score;
        else if (name === "Гуманистическая направленность (Г)") G = score;
        else if (name === "Спонтанность эмоциональной сферы (С)") S = score;
      }

      const totalScore = K + P + G + S;
      const maxScore = 32 * 5;
      const percentage = Math.round((totalScore / maxScore) * 100);

      let level, description;
      if (percentage >= 80) {
        level = "Очень высокий уровень мудрости";
        description = "Вы обладаете зрелым мышлением, эмоциональной устойчивостью и гуманистической направленностью.";
      } else if (percentage >= 65) {
        level = "Высокий уровень мудрости";
        description = "Вы склонны к рефлексии, сопереживанию и взвешенным решениям.";
      } else if (percentage >= 50) {
        level = "Средний уровень мудрости";
        description = "У вас есть потенциал к мудрости, но требуется больше осознанности и принятия жизни.";
      } else if (percentage >= 35) {
        level = "Ниже среднего";
        description = "Мудрость выражена слабо. Возможно, преобладают импульсивность и критичность.";
      } else {
        level = "Низкий уровень мудрости";
        description = "Преобладают эмоциональная неустойчивость, непринятие неопределённости и замкнутость.";
      }

      const result = {
        totalScore,
        percentage,
        level,
        description,
        K,
        P,
        G,
        S
      };

      console.log("📊 Результаты:", result);

      const testResults = JSON.parse(localStorage.getItem('testResults') || '[]');
      const currentIndex = parseInt(localStorage.getItem('currentTestIndex') || '0');

      testResults[currentIndex] = {
        id: testSequence[currentIndex]?.id || "wisdom",
        name: testSequence[currentIndex]?.title || "Опросник",
        totalScore,
        percentage,
        level,
        K,
        P,
        G,
        S,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('testResults', JSON.stringify(testResults));

      const success = await saveToGoogleSheets(result);

      if (success) {
        const nextIndex = currentIndex + 1;
        if (nextIndex < testSequence.length) {
          localStorage.setItem('currentTestIndex', nextIndex);
          window.location.href = testSequence[nextIndex].file;
        } else {
          window.location.href = "../complete.html";
        }
      } else {
        alert("Произошла ошибка при отправке данных. Попробуйте ещё раз.");
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
    });
  </script>

</body>
</html>
