<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опросник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../desing/css/style-bw.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <nav>
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <a href="../index.html" class="text-lg font-bold">Исследование</a>
      <div class="flex gap-6">
        <a href="../index.html">Главная</a>
        <a href="#" class="open-privacy-modal">Конфиденциальность</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="question-card">
      <h2 class="text-xl font-bold text-center mb-2">Опросник</h2>
      <p class="text-sm text-gray-500 text-center mb-8">
        Ответьте «Да» или «Нет» на каждое утверждение.
      </p>

      <div class="overflow-x-auto">
        <table class="question-table">
          <thead>
            <tr>
              <th class="text-left py-2 pr-4">Вопрос</th>
              <th class="text-center py-2 px-4">Да</th>
              <th class="text-center py-2 px-4">Нет</th>
            </tr>
          </thead>
          <tbody id="questionsContainer">

          </tbody>
        </table>
      </div>

      <div class="mt-10">
        <button onclick="submitAll()" class="btn-primary w-full">
          Отправить результаты
        </button>
      </div>
    </div>
  </div>

  <script>
    let gender = "";
    let age = "";
    let education = "";
    let participantId = localStorage.getItem('participantId') || "";

    try {
      const participantData = JSON.parse(localStorage.getItem('participantData') || '{}');
      gender = participantData.gender || "";
      age = participantData.age || "";
      education = participantData.education || "";
      console.log("✅ Данные анкеты загружены:", { gender, age, education, participantId });
    } catch (e) {
      console.warn("⚠️ Нет данных анкеты, используются пустые значения");
    }

    const questions = [
      "Я внимательно читаю каждую книгу, прежде чем вернуть ее в библиотеку.",
      "Я не испытываю колебаний, когда кому-нибудь нужно помочь в беде.",
      "Я всегда внимательно слежу за тем, как я одет.",
      "Дома я веду себя за столом так же, как в столовой.",
      "Я никогда не испытываю ни к кому сильных симпатий.",
      "Был(и) случай(и), когда я бросил что-то делать, потому что не был уверен в своих силах.",
      "Иногда я люблю позлословить об отсутствующих.",
      "Я всегда внимательно слушаю собеседника, кто бы он ни был.",
      "Был случай, когда я придумал вескую причину, чтобы оправдаться.",
      "Случалось, я пользовался оплошностью человека.",
      "Я всегда охотно признаю свои ошибки.",
      "Иногда вместо того, чтобы простить человека, я стараюсь отплатить ему тем же.",
      "Были случаи, когда я настаивал на том, чтобы делали по-моему.",
      "У меня не возникает внутреннего протеста, когда меня просят оказать услугу.",
      "У меня никогда не возникает досады, когда высказывают мнение, противоположное моему.",
      "Перед длительной поездкой я всегда тщательно продумываю, что с собой взять.",
      "Были случаи, когда я завидовал удаче других.",
      "Иногда меня раздражают люди, которые обращаются ко мне с просьбой.",
      "Когда у людей неприятности, я иногда думаю, что они получили по заслугам.",
      "Я никогда с улыбкой не говорил неприятных вещей."
    ];

    // Шкалы
    const positive = [0, 1, 2, 3, 4, 7, 10, 13, 14, 15, 19]; 
    const negative = [5, 6, 8, 9, 11, 12, 16, 17, 18]; 

    const testSequence = [
      { id: "life-prod", title: "Опросник 1", file: "life-prod.html" },
      { id: "spiritual-orientation", title: "Опросник 2", file: "spirit-orient.html" },
      { id: "spiritual-personality", title: "Опросник 3", file: "spirit-person.html" },
      { id: "altruism", title: "Опросник 4", file: "altruism.html" },
      { id: "sjo", title: "Опросник 5", file: "sjo.html" },
      { id: "wisdom", title: "Опросник 6", file: "wisdom.html" },
      { id: "reflex", title: "Опросник 7", file: "reflex.html" },
      { id: "self-inter", title: "Опросник 8", file: "self-inter.html" },
      { id: "pfoo", title: "Опросник 9", file: "pfoo.html" },
      { id: "motiv", title: "Опросник 10", file: "motiv.html" }
    ];

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      let html = '';
      questions.forEach((text, index) => {
        const num = index + 1;
        html += `
          <tr>
            <td class="q-text text-sm py-2 pr-4">${num}. ${text}</td>
            <td class="q-options text-center py-2 px-4">
              <input type="radio" name="q${num}" value="Да" id="q${num}_yes">
              <label for="q${num}_yes">Да</label>
            </td>
            <td class="q-options text-center py-2 px-4">
              <input type="radio" name="q${num}" value="Нет" id="q${num}_no">
              <label for="q${num}_no">Нет</label>
            </td>
          </tr>
        `;
      });
      container.innerHTML = html;
    }

    async function saveToGoogleSheets(data) {
      const scriptURL = "https://script.google.com/macros/s/AKfycbxaH8oWEE0mkKv89nnS-IMU4BkfVX9G0MGzcnnc_pUJImb3WO1e0XtdRwKJbUUc4KmuXw/exec";
      const formData = new FormData();
      formData.append("participant_id", participantId);
      formData.append("test_name", "Марлоу-Краун (мотивация одобрения)");
      formData.append("gender", gender);
      formData.append("age", age);
      formData.append("education", education);
      formData.append("total_score", data.totalScore);
      formData.append("level", data.level);

      try {
        await fetch(scriptURL, { method: "POST", body: formData, mode: "no-cors" });
        console.log("✅ Результаты 'Марлоу-Краун' отправлены");
        return true;
      } catch (e) {
        console.error("❌ Ошибка отправки:", e);
        return false;
      }
    }

    async function submitAll() {
      const answers = {};
      const radios = document.querySelectorAll('input[type="radio"]:checked');
      radios.forEach(el => {
        const name = el.name;
        const num = parseInt(name.substring(1));
        answers[num] = el.value;
      });

      if (Object.keys(answers).length < questions.length) {
        alert(`Пожалуйста, ответьте на все вопросы. Заполнено ${Object.keys(answers).length} из ${questions.length}.`);
        return;
      }

      let score = 0;
      positive.forEach(i => { if (answers[i] === "Да") score++; });
      negative.forEach(i => { if (answers[i] === "Нет") score++; });

      let level, description;
      if (score >= 13) {
        level = "Высокий уровень";
        description = "Высокая потребность в социальном одобрении. Вы сильно зависите от мнения окружающих.";
      } else if (score >= 10) {
        level = "Средний уровень";
        description = "Умеренная потребность в одобрении. Вы в целом независимы, но иногда ориентируетесь на мнение окружающих.";
      } else {
        level = "Низкий уровень";
        description = "Низкая потребность в одобрении. Вы независимы, собственные убеждения для вас важнее, чем чужое мнение.";
      }

      const result = { totalScore: score, level, description };

      const testResults = JSON.parse(localStorage.getItem('testResults') || '[]');
      const currentIndex = parseInt(localStorage.getItem('currentTestIndex') || '0');

      testResults[currentIndex] = {
        id: testSequence[currentIndex]?.id || "motiv",
        name: testSequence[currentIndex]?.title || "Опросник",
        totalScore: score,
        level,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('testResults', JSON.stringify(testResults));

      const success = await saveToGoogleSheets(result);
      if (success) {

        window.location.href = "../complete.html";
      } else {
        alert("Произошла ошибка при отправке данных. Попробуйте ещё раз.");
      }
    }

    document.addEventListener('DOMContentLoaded', renderQuestions);
  </script>

</body>
</html>
