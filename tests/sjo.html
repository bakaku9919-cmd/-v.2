<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опросник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../desing/css/style-bw.css">
  <style>
    .scale-label {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      cursor: pointer;
      width: 28px;
    }
    .scale-label input[type="radio"] {
      margin-bottom: 2px;
      width: 16px;
      height: 16px;
    }
    @media (max-width: 768px) {
      .scale-label {
        width: 24px;
        font-size: 0.65rem;
      }
      .scale-label input[type="radio"] {
        width: 14px;
        height: 14px;
      }
    }
  </style>
</head>
  
<body class="bg-gray-50 min-h-screen">

  <nav>
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <a href="../index.html" class="text-lg font-bold">Исследование</a>
      <div class="flex gap-6">
        <a href="../index.html">Главная</a>
        <a href="#" class="open-privacy-modal">Конфиденциальность</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="question-card">
      <h2 class="text-xl font-bold text-center mb-2">Опросник</h2>
      <p class="text-sm text-gray-500 text-center mb-8">
        Оцените, насколько каждое утверждение соответствует Вам.
      </p>
      
      <div class="space-y-4" id="questionsContainer">

      </div>
      <div class="overflow-x-auto">
        <table class="question-table">
          <thead>
            <tr>
              <th class="text-left py-2 pr-4">Вопрос</th>
              <th class="text-center py-2 px-1 w-10">-3</th>
              <th class="text-center py-2 px-1 w-10">-2</th>
              <th class="text-center py-2 px-1 w-10">-1</th>
              <th class="text-center py-2 px-1 w-10">0</th>
              <th class="text-center py-2 px-1 w-10">1</th>
              <th class="text-center py-2 px-1 w-10">2</th>
              <th class="text-center py-2 px-1 w-10">3</th>
            </tr>
          </thead>
          <tbody id="questionsContainer">
          </tbody>
        </table>
      </div>

      <div class="mt-10">
        <button onclick="submitAll()" class="btn-primary w-full">
          Отправить результаты
        </button>
      </div>
    </div>
  </div>

  <script>

    let gender = "";
    let age = "";
    let education = "";
    let participantId = localStorage.getItem('participantId') || "";

    try {
      const participantData = JSON.parse(localStorage.getItem('participantData') || '{}');
      gender = participantData.gender || "";
      age = participantData.age || "";
      education = participantData.education || "";
      console.log("✅ Данные анкеты загружены:", { gender, age, education, participantId });
    } catch (e) {
      console.warn("⚠️ Нет данных анкеты, используются пустые значения");
    }

    const questions = [
      ["Обычно мне очень скучно.", "Обычно я полон энергии."],
      ["Жизнь кажется мне всегда волнующей и захватывающей.", "Жизнь кажется мне совершенно спокойной и рутинной."],
      ["В жизни я не имею определенных целей и намерений.", "В жизни я имею очень ясные цели и намерения."],
      ["Моя жизнь представляется мне крайне бессмысленной и бесцельной.", "Моя жизнь представляется мне вполне осмысленной и целеустремленной."],
      ["Каждый день кажется мне всегда новым и непохожим на другие.", "Каждый день кажется мне совершенно похожим на все другие."],
      ["Когда я уйду на пенсию, я займусь интересными вещами, которыми всегда мечтал заняться.", "Когда я уйду на пенсию, я постараюсь не обременять себя никакими заботами."],
      ["Моя жизнь сложилась именно так, как я мечтал.", "Моя жизнь сложилась совсем не так, как я мечтал."],
      ["Я не добился успехов в осуществлении своих жизненных планов.", "Я осуществил многое из того, что было мною запланировано в жизни."],
      ["Моя жизнь пуста и неинтересна.", "Моя жизнь наполнена интересными делами."],
      ["Если бы мне пришлось подводить сегодня итог моей жизни, то я бы сказал, что она была вполне осмысленной.", "Если бы мне пришлось сегодня подводить итог моей жизни, то я бы сказал, что она не имела смысла."],
      ["Если бы я мог выбирать, то я бы построил свою жизнь совершенно иначе.", "Если бы я мог выбирать, то я бы прожил жизнь еще раз так же, как живу сейчас."],
      ["Когда я смотрю на окружающий меня мир, он часто приводит меня в растерянность и беспокойство.", "Когда я смотрю на окружающий меня мир, он совсем не вызывает у меня беспокойства и растерянности."],
      ["Я человек очень обязательный.", "Я человек совсем не обязательный."],
      ["Я полагаю, что человек имеет возможность осуществить свой жизненный выбор по своему желанию.", "Я полагаю, что человек лишен возможности выбирать из-за влияния природных способностей и обстоятельств."],
      ["Я определенно могу назвать себя целеустремленным человеком.", "Я не могу назвать себя целеустремленным человеком."],
      ["В жизни я еще не нашел своего призвания и ясных целей.", "В жизни я нашел свое призвание и цели."],
      ["Мои жизненные взгляды еще не определились.", "Мои жизненные взгляды вполне определились."],
      ["Я считаю, что мне удалось найти призвание и интересные цели в жизни.", "Я едва ли способен найти призвание и интересные цели в жизни."],
      ["Моя жизнь в моих руках, и я сам управляю ею.", "Моя жизнь не подвластна мне и она управляется внешними событиями."],
      ["Мои повседневные дела приносят мне удовольствие и удовлетворение.", "Мои повседневные дела приносят мне сплошные неприятности и переживания."]
    ];

    // Шкалы
    const scales = {
      "Цели в жизни": [3, 4, 10, 16, 17, 18],
      "Процесс жизни": [1, 2, 4, 5, 7, 9],
      "Результативность жизни": [8, 9, 10, 12, 20],
      "Локус контроля – Я": [1, 15, 16, 19],
      "Локус контроля – жизнь": [7, 10, 11, 14, 18, 19]
    };

    // Инверсия
    const reverseItems = [2, 5, 6, 7, 10, 13, 14, 15, 18, 19, 20];

    const testSequence = [
      { id: "life-prod", title: "Опросник 1", file: "life-prod.html" },
      { id: "spiritual-orientation", title: "Опросник 2", file: "spirit-orient.html" },
      { id: "spiritual-personality", title: "Опросник 3", file: "spirit-person.html" },
      { id: "altruism", title: "Опросник 4", file: "altruism.html" },
      { id: "sjo", title: "Опросник 5", file: "sjo.html" },
      { id: "wisdom", title: "Опросник 6", file: "wisdom.html" },
      { id: "reflex", title: "Опросник 7", file: "reflex.html" },
      { id: "self-inter", title: "Опросник 8", file: "self-inter.html" },
      { id: "pfoo", title: "Опросник 9", file: "pfoo.html" },
      { id: "motiv", title: "Опросник 10", file: "motiv.html" }
    ];

        function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      let html = '';

      questions.forEach((pair, index) => {
        const num = index + 1;
        html += `
          <div class="flex items-start gap-2 border-b border-gray-100 pb-3">
            <span class="text-sm text-gray-700 flex-1 text-right">${num}. ${pair[0]}</span>
            <div class="flex gap-1 flex-shrink-0">
              <label class="scale-label"><input type="radio" name="q${num}" value="-3"> 3</label>
              <label class="scale-label"><input type="radio" name="q${num}" value="-2"> 2</label>
              <label class="scale-label"><input type="radio" name="q${num}" value="-1"> 1</label>
              <label class="scale-label"><input type="radio" name="q${num}" value="0"> 0</label>
              <label class="scale-label"><input type="radio" name="q${num}" value="1"> 1</label>
              <label class="scale-label"><input type="radio" name="q${num}" value="2"> 2</label>
              <label class="scale-label"><input type="radio" name="q${num}" value="3"> 3</label>
            </div>
            <span class="text-sm text-gray-700 flex-1 text-left">${pair[1]}</span>
          </div>
        `;
      });

      container.innerHTML = html;
    }
    // GOOGLE SHEETS
    async function saveToGoogleSheets(data) {
      const scriptURL = "https://script.google.com/macros/s/AKfycbxhpWs3iBBuulhpDawZFWJ7VMpd632e6AwgH2QwRFhZPaSolaPUa-F9yGHvGkk3-ouj/exec";
      const formData = new FormData();

      formData.append("participant_id", participantId);
      formData.append("test_name", "СЖО (Смысложизненные ориентации)");
      formData.append("timestamp", new Date().toISOString());
      formData.append("gender", gender);
      formData.append("age", age);
      formData.append("education", education);
      formData.append("total_score", data.totalScore);
      formData.append("percentage", data.percentage);
      formData.append("level", data.level);

      for (const [key, value] of Object.entries(data.scaleResults)) {
        formData.append(`scale_${key}`, value);
      }

      try {
        await fetch(scriptURL, { method: "POST", body: formData, mode: "no-cors" });
        console.log("✅ Результаты 'СЖО' отправлены");
        return true;
      } catch (e) {
        console.error("❌ Ошибка отправки:", e);
        return false;
      }
    }

    async function submitAll() {
      const answers = {};
      const radios = document.querySelectorAll('input[type="radio"]:checked');

      radios.forEach(el => {
        const name = el.name;
        const num = parseInt(name.substring(1));
        answers[num] = parseInt(el.value);
      });

      if (Object.keys(answers).length < questions.length) {
        alert(`Пожалуйста, ответьте на все вопросы. Заполнено ${Object.keys(answers).length} из ${questions.length}.`);
        return;
      }

      // Перевод в нормальное значение ===
      const normalized = {};
      for (let i = 1; i <= 20; i++) {
        const val = answers[i] || 0;
        normalized[i] = reverseItems.includes(i) ? -val : val;
      }

      // Расчет
      const scaleResults = {};
      let totalRaw = 0;

      for (const [name, indices] of Object.entries(scales)) {
        let rawScore = 0;
        indices.forEach(num => {
          rawScore += normalized[num] || 0;
        });
        const maxPoints = indices.length * 3;
        const positiveScore = rawScore + maxPoints;
        const maxScoreForScale = maxPoints * 2;
        const percent = Math.round((positiveScore / maxScoreForScale) * 100);
        scaleResults[name] = positiveScore;
        totalRaw += rawScore;
      }

      // Общий бал
      const totalPositive = totalRaw + 60;
      const totalMax = 120;
      const percentage = Math.round((totalPositive / totalMax) * 100);

      let level, description;
      if (percentage >= 80) {
        level = "Очень высокий уровень";
        description = "Вы обладаете ясными жизненными целями, ощущаете ценность жизни и активно развиваетесь.";
      } else if (percentage >= 65) {
        level = "Высокий уровень";
        description = "Вы склонны к осмысленному образу жизни.";
      } else if (percentage >= 50) {
        level = "Средний уровень";
        description = "Смысл жизни присутствует, но требует углубления.";
      } else if (percentage >= 35) {
        level = "Ниже среднего";
        description = "Жизненные цели слабо выражены.";
      } else {
        level = "Низкий уровень";
        description = "Возможно, вы переживаете экзистенциальный вакуум.";
      }

      const result = {
        totalScore: totalPositive,
        percentage,
        level,
        description,
        scaleResults
      };

      console.log("📊 Результаты:", result);

      const testResults = JSON.parse(localStorage.getItem('testResults') || '[]');
      const currentIndex = parseInt(localStorage.getItem('currentTestIndex') || '0');

      testResults[currentIndex] = {
        id: testSequence[currentIndex]?.id || "sjo",
        name: testSequence[currentIndex]?.title || "Опросник",
        totalScore: totalPositive,
        percentage,
        level,
        scaleResults,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('testResults', JSON.stringify(testResults));

      const success = await saveToGoogleSheets(result);

      if (success) {
        const nextIndex = currentIndex + 1;
        if (nextIndex < testSequence.length) {
          localStorage.setItem('currentTestIndex', nextIndex);
          window.location.href = testSequence[nextIndex].file;
        } else {
          window.location.href = "../complete.html";
        }
      } else {
        alert("Произошла ошибка при отправке данных. Попробуйте ещё раз.");
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
    });
  </script>

</body>
</html>
