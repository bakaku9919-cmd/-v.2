<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опросник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../desing/css/style-bw.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Навигация  -->
  <nav>
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <a href="../index.html" class="text-lg font-bold">Исследование</a>
      <div class="flex gap-6">
        <a href="../index.html">Главная</a>
        <a href="#" class="open-privacy-modal">Конфиденциальность</a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="question-card">
      <h2 class="text-xl font-bold text-center mb-2">Опросник</h2>
      <p class="text-sm text-gray-500 text-center mb-8">
        Оцените, насколько каждое утверждение соответствует Вам, по шкале от 1 до 5.
      </p>

      <div class="overflow-x-auto">
        <table class="question-table">
          <thead>
            <tr>
              <th class="text-left py-2 pr-4">Вопрос</th>
              <th class="text-center py-2 px-1 w-10">1</th>
              <th class="text-center py-2 px-1 w-10">2</th>
              <th class="text-center py-2 px-1 w-10">3</th>
              <th class="text-center py-2 px-1 w-10">4</th>
              <th class="text-center py-2 px-1 w-10">5</th>
            </tr>
          </thead>
          <tbody id="questionsContainer">
          </tbody>
        </table>
      </div>

      <div class="mt-10">
        <button onclick="submitAll()" class="btn-primary w-full">
          Отправить результаты
        </button>
      </div>
    </div>
  </div>

  <script>

    let gender = "";
    let age = "";
    let education = "";
    let participantId = localStorage.getItem('participantId') || "";

    try {
      const participantData = JSON.parse(localStorage.getItem('participantData') || '{}');
      gender = participantData.gender || "";
      age = participantData.age || "";
      education = participantData.education || "";
      console.log("✅ Данные анкеты загружены:", { gender, age, education, participantId });
    } catch (e) {
      console.warn("⚠️ Нет данных анкеты, используются пустые значения");
    }

    const questions = [
      "Проявлять бескорыстную любовь к людям",
      "Отстаивать истину, даже когда все вокруг против",
      "Ценить красоту человечности больше, чем материальную выгоду",
      "Радоваться успехам и достижениям других людей",
      "Признать ценность и смысл духовного саморазвития, важность улучшения себя",
      "Реализовывать в своем поведении стремление к высшим ценностям: истине, добру, справедливости, красоте",
      "Любить все живое",
      "Стремиться к самопознанию и открытию своей духовной сущности",
      "Не обижать других",
      "Совершать поступки, приносящие людям благо",
      "Стремиться к постижению тайны и высшего смысла бытия",
      "Помогать другим людям, не думая о вознаграждении",
      "Проявлять к окружающим дружелюбие",
      "Быть правдивым и честным даже в трудных ситуациях",
      "Проявлять отсутствие враждебности к кому бы то ни было",
      "Быть благодарным за то хорошее, что сделали ему люди",
      "Желать, чтобы другие были счастливы",
      "Принимать любую жизненную ситуацию, извлекая из нее опыт для саморазвития",
      "Жить и действовать в соответствии с совестью",
      "Видеть хорошее в людях",
      "Стремиться к высшим смыслам бытия: человечности и мудрости",
      "Не проявлять жадность",
      "Стремиться улучшить мир с помощью своей деятельности",
      "Проявлять великодушие в реальном поведении",
      "Стремиться к достижению высокой цели, несмотря ни на какие препятствия",
      "Видеть смысл в избавлении от эгоизма и проявлении любви к людям",
      "Проявлять сострадание в реальных жизненных ситуациях",
      "Стремиться к познанию высшей истины, к Божественному, Абсолюту",
      "Оказывать действенную помощь другим в экстренной ситуации",
      "Выполнять свои обязанности добросовестно",
      "Видеть свое предназначение в стремлении делать добро, помогать людям, совершенствовать мир",
      "Ценить то, что имеет",
      "Сохранять оптимизм даже в трудных ситуациях",
      "Слушать и понимать голос совести",
      "Проявлять добродетельное поведение в реальных жизненных ситуациях",
      "Видеть смысл не в накопительстве, а в развитии духовного потенциала",
      "Стойко переносить удары судьбы",
      "Признавать свои ошибки, при этом исправляя их",
      "Проявлять мужество, защищая справедливость",
      "Не поддаваться унынию"
    ];

    // Шкалы
    const scales = {
      "Ценностно-смысловые устремления": [3, 5, 6, 8, 11, 21, 26, 28, 32, 36],
      "Высшие нравственные чувства": [1, 4, 7, 13, 15, 16, 17, 20, 27, 34],
      "Склонность к добродетельному поведению": [9, 10, 12, 19, 22, 23, 24, 30, 31, 35],
      "Моральная сила духа": [2, 14, 18, 25, 29, 33, 37, 38, 39, 40]
    };


    const testSequence = [
      { id: "life-prod", title: "Опросник 1", file: "life-prod.html" },
      { id: "spiritual-orientation", title: "Опросник 2", file: "spirit-orient.html" },
      { id: "spiritual-personality", title: "Опросник 3", file: "spirit-person.html" },
      { id: "altruism", title: "Опросник 4", file: "altruism.html" },
      { id: "sjo", title: "Опросник 5", file: "sjo.html" },
      { id: "wisdom", title: "Опросник 6", file: "wisdom.html" },
      { id: "reflex", title: "Опросник 7", file: "reflex.html" },
      { id: "self-inter", title: "Опросник 8", file: "self-inter.html" },
      { id: "pfoo", title: "Опросник 9", file: "pfoo.html" },
      { id: "motiv", title: "Опросник 10", file: "motiv.html" }
    ];

  
    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      let html = '';
      questions.forEach((text, index) => {
        const num = index + 1;
        html += `
          <tr>
            <td class="q-text text-sm py-2 pr-4">${num}. ${text}</td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="1" id="q${num}_1">
              <label for="q${num}_1">1</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="2" id="q${num}_2">
              <label for="q${num}_2">2</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="3" id="q${num}_3">
              <label for="q${num}_3">3</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="4" id="q${num}_4">
              <label for="q${num}_4">4</label>
            </td>
            <td class="q-options text-center py-2 px-1">
              <input type="radio" name="q${num}" value="5" id="q${num}_5">
              <label for="q${num}_5">5</label>
            </td>
          </tr>
        `;
      });
      container.innerHTML = html;
    }

    // GOOGLE SHEETS
    async function saveToGoogleSheets(data) {
      const scriptURL = "https://script.google.com/macros/s/AKfycbxhpWs3iBBuulhpDawZFWJ7VMpd632e6AwgH2QwRFhZPaSolaPUa-F9yGHvGkk3-ouj/exec";
      const formData = new FormData();

      formData.append("participant_id", participantId);
      formData.append("test_name", "Духовная ориентация личности");
      formData.append("gender", gender);
      formData.append("age", age);
      formData.append("education", education);
      formData.append("total_score", data.totalScore);
      formData.append("percentage", data.percentage);
      formData.append("level", data.level);

      for (const [key, value] of Object.entries(data.scaleResults)) {
        formData.append(`scale_${key}`, value);
      }

      try {
        await fetch(scriptURL, { method: "POST", body: formData, mode: "no-cors" });
        console.log("✅ Результаты 'Духовная ориентация личности' отправлены");
        return true;
      } catch (e) {
        console.error("❌ Ошибка отправки:", e);
        return false;
      }
    }

    async function submitAll() {
      const answers = {};
      const radios = document.querySelectorAll('input[type="radio"]:checked');

      radios.forEach(el => {
        const name = el.name;
        const num = parseInt(name.substring(1));
        answers[num] = parseInt(el.value);
      });

      if (Object.keys(answers).length < questions.length) {
        alert(`Пожалуйста, ответьте на все вопросы. Заполнено ${Object.keys(answers).length} из ${questions.length}.`);
        return;
      }

      const scaleResults = {};
      let totalScore = 0;
      let maxScore = questions.length * 5;

      for (const [scaleName, indices] of Object.entries(scales)) {
        let score = 0;
        indices.forEach(num => {
          score += answers[num] || 0;
        });
        scaleResults[scaleName] = score;
        totalScore += score;
      }

      const percentage = Math.round((totalScore / maxScore) * 100);

      let level, description;
      if (percentage >= 82) {
        level = "Очень высокий уровень";
        description = "Ярко выражена духовная ориентация личности.";
      } else if (percentage >= 70) {
        level = "Высокий уровень";
        description = "Хорошо развитая духовная ориентация.";
      } else if (percentage >= 55) {
        level = "Средний уровень";
        description = "Умеренная духовная ориентация.";
      } else if (percentage >= 40) {
        level = "Ниже среднего";
        description = "Слабая выраженность духовной ориентации.";
      } else {
        level = "Низкий уровень";
        description = "Низкая духовная ориентация личности.";
      }

      const result = {
        totalScore,
        maxScore,
        percentage,
        level,
        description,
        scaleResults
      };

      console.log("📊 Результаты:", result);

      const testResults = JSON.parse(localStorage.getItem('testResults') || '[]');
      const currentIndex = parseInt(localStorage.getItem('currentTestIndex') || '0');

      testResults[currentIndex] = {
        id: testSequence[currentIndex]?.id || "spiritual-orientation",
        name: testSequence[currentIndex]?.title || "Опросник",
        totalScore,
        percentage,
        level,
        scaleResults,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('testResults', JSON.stringify(testResults));

      const success = await saveToGoogleSheets(result);

      if (success) {
        const nextIndex = currentIndex + 1;
        if (nextIndex < testSequence.length) {
          localStorage.setItem('currentTestIndex', nextIndex);
          window.location.href = testSequence[nextIndex].file;
        } else {
          window.location.href = "../complete.html";
        }
      } else {
        alert("Произошла ошибка при отправке данных. Попробуйте ещё раз.");
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
    });
  </script>

</body>
</html>
